name: avan

x-app-environment: &app-environment
  DB_NAME: ${DB_NAME:-avan}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_SSL_MODE: disable
  DB_USER: ${DB_USER:-avan}
  DB_PASSWORD: ${DB_PASSWORD:-avan}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: 0
  CONSUMER_COUNT: ${CONSUMER_COUNT:-1}
  SERVER_PORT: 8083
  SERVER_DOMAIN: notification.layra.local:8083
  GOSSIP_HOST: server:7947

x-app-dependencies: &app-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

x-app: &app
  build:
    context: ./src
    dockerfile: ../Dockerfile
  volumes:
    - ./src/config/config.yml:/etc/config.yaml:ro
  environment: *app-environment
  depends_on: *app-dependencies
  restart: unless-stopped

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-avan}
      POSTGRES_USER: ${DB_USER:-avan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-avan}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    <<: *app
    environment:
      <<: *app-environment
      RUNNING_MODE: server
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  nginx:
    image: nginx:stable-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8083:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 3

  consumer:
    <<: *app
    environment:
      <<: *app-environment
      RUNNING_MODE: consumer
    depends_on:
      <<: *app-dependencies
      server:
        condition: service_healthy
    scale: ${CONSUMER_COUNT:-1}

volumes:
  postgres_data:
  redis_data:
