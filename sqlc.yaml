version: "2"
sql:
  - schema: "internal/db/migrations/mysql/001_initialize_schema.sql"
    queries: "internal/db/queries/mysql/"
    engine: "mysql"
    gen:
      go:
        package: "sqlc"
        emit_db_tags: true
        emit_interface: false
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
        output_files_suffix: _mysql
        out: "internal/db/sqlc/"

  - schema: "internal/db/migrations/postgresql/001_initialize_schema.sql"
    queries: "internal/db/queries/postgresql/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        emit_db_tags: true
        emit_interface: false
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
        output_files_suffix: _postgresql
        out: "internal/db/sqlc/"

  - schema: "internal/db/migrations/sqlite/001_initialize_schema.sql"
    queries: "internal/db/queries/sqlite/"
    engine: "sqlite"
    gen:
      go:
        package: "sqlc"
        emit_db_tags: true
        emit_interface: false
        emit_json_tags: true
        emit_enum_valid_method: true
        emit_pointers_for_null_types: true
        output_files_suffix: _sqlite
        out: "internal/db/sqlc/"
