version: "2"
sql:
  - schema:
      - "internal/db/migrations/postgresql/001_initialize_schema.sql"
      - "internal/db/migrations/postgresql/002_admin_and_sms_body_schema.sql"
      - "internal/db/migrations/postgresql/003_message_retry.sql"
      - "internal/db/migrations/postgresql/004_provider_hierarchy_and_routing.sql"
      - "internal/db/migrations/postgresql/005_sms_request_modes.sql"
      - "internal/db/migrations/postgresql/006_phase3_reliability.sql"
      - "internal/db/migrations/postgresql/007_provider_security_policy.sql"
    queries: "internal/db/queries/postgresql/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc"
        emit_db_tags: true
        emit_interface: false
        emit_json_tags: true
        emit_enum_valid_method: true
        output_files_suffix: _postgresql
        out: "internal/db/sqlc/"
        overrides:
          - db_type: "pg_catalog.int4"
            go_type: "int64"
          - db_type: "pg_catalog.int4"
            nullable: true
            go_type:
              type: "int64"
              pointer: true
          - db_type: "pg_catalog.varchar"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "pg_catalog.bool"
            nullable: true
            go_type:
              type: "bool"
              pointer: true
          - column: "messages.template_id"
            go_type:
              type: "int64"
              pointer: true
          - column: "messages.error"
            go_type:
              type: "string"
              pointer: true
          - column: "sms_configs.body_schema"
            go_type:
              type: "string"
              pointer: true
          - column: "settings.value"
            go_type:
              type: "string"
              pointer: true
          - column: "sms_configs.auth_token_value"
            go_type:
              type: "string"
              pointer: true
